<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        html, 
        body{
           width: 100%;
           height: 100%;
           
        }
        input{
            display: block;
        }
        #main{
           padding: 30px;
           width: 100%;
           height: 100%;
           background-color: #222;
        }
       .card{
          max-width: 250px;
          color: white;
          margin-top: 40px;
          border-radius: 10px;
          padding: 20px;
          display: inline-block;
          border: 1px solid #555;
       }
       .profile{
          height: 50px;
          width: 50px;
          border-radius: 50%;
          
          margin-bottom: 8px;
          overflow: hidden;
       }
       .profile img{
         width: 100%;
         height: 100%;
         object-fit: cover;
       }
       .card h5{
          margin-top: 5px;
       }
       .card p{
          font-size: 12px;
          margin-top: 10px;
       }
        h1{
            color: #555;
            font-size: 20rem;
            font-weight: 300;
            user-select: none;
        }
        
        #btn{
            padding: 12px 22px;
            border-radius: 8px;
            background-color: rgb(41, 143, 114);
            font-weight: 500;
            font-size: 1rem;
        }
        #btn:hover{
            background-color: rgb(24, 82, 66);
        }
    </style>
</head>
<body>

    <div id="main">
        <form action="">
            <input type="text" placeholder="profile-pic">
            <input type="text" placeholder="name">
            <input type="text" placeholder="role">
            <input type="text" placeholder="info">
            <input type="submit">
        </form>
       
    </div>
