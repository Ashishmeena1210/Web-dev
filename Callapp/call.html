    <div class="color-picker">
      <div class="color-dot dot-black"></div>
      <div class="color-dot dot-purple"></div>
      <div class="color-dot dot-brown"></div>
      <div class="color-dot dot-teal"></div>
    </div>
  </div>

  <!-- 2. CREATE CARD (Form overlay centered on top) -->
  <div class="form-container">
    <h2 class="form-title">New Call</h2>
    
    <form class="call-form">
      <div class="form-group">
        <label for="imgUrl">Image URL</label>
        <input type="text" id="imgUrl" placeholder="https://i.pinimg.com/736x/1f/1b/81/1f1b816fbed1fd28c132bdc6e8">
      </div>

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Ashish">
      </div>

      <div class="form-group">
        <label for="hometown">Home Town</label>
        <input type="text" id="hometown" placeholder="Indore">
      </div>

      <div class="form-group">
        <label for="purpose">Purpose</label>
        <input type="text" id="purpose" class="focused-input" placeholder="Call for Enquiry">
      </div>

      <div class="form-group">
        <label>Category</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="category" value="Emergency">
            <span class="custom-radio"></span>
            Emergency
          </label>
          <label class="radio-label">
            <input type="radio" name="category" value="Important">
            <span class="custom-radio"></span>
            Important
          </label>
          <label class="radio-label">
            <input type="radio" name="category" value="Urgent">
            <span class="custom-radio"></span>
            Urgent
          </label>
          <label class="radio-label">
            <input type="radio" name="category" value="No Rush">
            <span class="custom-radio"></span>
            No Rush
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit">Create Note</button>
        <button type="button" class="btn-close">Close</button>
      </div>
    </form>
  </div>
<script src="call.js"></script>
</body>
</html>
