<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>User Cards</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#111111] min-h-screen text-white py-7">

    <!-- FORM -->
    <form autocomplete="off"
        class="bg-[#252525] border border-[#3a3a3a] rounded-xl shadow-xl
               p-5 mb-6 w-[330px] mx-auto">

        <!-- Heading -->
        <h2 class="text-2xl font-bold mb-5 text-center text-white">
            Add User
        </h2>


        <!-- Name -->
        <div class="mb-4">

            <label
                for="name"
                class="block text-xs font-medium text-gray-300 mb-1">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                required
                class="w-full h-5 px-2
                       bg-[#3b3b3b]
                       border border-[#454545]
                       rounded-md
                       text-white text-sm
                       focus:outline-none
                       focus:border-gray-500">
        </div>


        <!-- Role -->
        <div class="mb-4">

            <label
                for="role"
                class="block text-xs font-medium text-gray-300 mb-1">
                Role
            </label>

            <input
                type="text"
                id="role"
                name="role"
                required
                class="w-full h-7 px-2
                       bg-[#3b3b3b]
                       border border-[#454545]
                       rounded-md
                       text-white text-sm
                       focus:outline-none
                       focus:border-gray-500">
        </div>


        <!-- Bio -->
        <div class="mb-4">

            <label
                for="bio"
                class="block text-xs font-medium text-gray-300 mb-1">
                Bio
            </label>

            <textarea
                id="bio"
                name="bio"
                rows="3"
                required
                class="w-full px-2 py-1
                       bg-[#3b3b3b]
                       border border-[#454545]
                       rounded-md
                       text-white text-sm
                       resize-none
                       focus:outline-none
                       focus:border-gray-500"></textarea>
        </div>


        <!-- Photo URL -->
        <div class="mb-5">

            <label
                for="photo"
                class="block text-xs font-medium text-gray-300 mb-1">
                Photo URL
            </label>

            <input
                type="url"
                id="photo"
                name="photo"
                required
                class="w-full h-7 px-2
                       bg-[#3b3b3b]
                       border border-[#454545]
                       rounded-md
                       text-white text-sm
                       focus:outline-none
                       focus:border-gray-500">
        </div>


        <!-- Submit Button -->
        <button
            type="submit"
            class="w-full h-9
                   bg-transparent
                   border border-[#333333]
                   rounded-md
                   text-white text-xs
                   font-semibold
                   hover:bg-[#303030]
                   transition">
            Submit
        </button>

    </form>


    <!-- USER CARDS -->
    <div
        class="
               cardComponents grid grid-cols-1 md:grid-cols-3 gap-10 px-6 max-w-6xl mx-auto">

    </div>


    <!-- JAVASCRIPT -->
    <script src="this.js"></script>

</body>

</html>
